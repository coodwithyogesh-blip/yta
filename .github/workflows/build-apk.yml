name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{print $1}')
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Unable to detect active Java version."
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Active Java major version is $JAVA_MAJOR, which is lower than required Java 17."
            exit 1
          fi
          echo "Java environment verified: Java $JAVA_MAJOR (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists. Skipping creation."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keypass android \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000

            if [ ! -f "./debug.keystore" ]; then
              echo "Error: Failed to create ./debug.keystore"
              exit 1
            fi
            echo "Temporary debug keystore created successfully."
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected APK file not found at $EXPECTED_APK"
            echo "Searching for APKs inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: APK file $EXPECTED_APK exists but is empty."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "Error: File $EXPECTED_APK does not have .apk extension."
              exit 1
              ;;
          esac

          echo "APK successfully verified: $EXPECTED_APK (regular, non-empty .apk file)."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RUNNER_TEMP_DIR=$(mktemp -d)
          RAW_REPO="${{ github.repository }}"
          REPO_NAME=$(echo "$RAW_REPO" | awk -F '/' '{print $2}' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-zA-Z0-9._-]/-/g')
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="android-app"
          fi
          RELEASE_ASSET_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          RELEASE_ASSET_PATH="${RUNNER_TEMP_DIR}/${RELEASE_ASSET_NAME}"

          cp app/build/outputs/apk/debug/app-debug.apk "$RELEASE_ASSET_PATH"

          if [ ! -f "$RELEASE_ASSET_PATH" ] || [ ! -s "$RELEASE_ASSET_PATH" ]; then
            echo "Error: Failed to prepare release asset at $RELEASE_ASSET_PATH"
            exit 1
          fi

          echo "asset_path=$RELEASE_ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$RELEASE_ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "Prepared APK release asset: $RELEASE_ASSET_PATH ($RELEASE_ASSET_NAME)"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset is missing or empty."
            exit 1
          fi
          
          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "Error: Asset does not have .apk extension."
              exit 1
              ;;
          esac
          
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          
          RELEASE_NOTES=$(cat <<'EOF'
          ### Debug APK Build #${{ github.run_number }}
          
          - **Notice**: This is an automatically generated debug APK.
          - **Environment**: The APK was built by GitHub Actions.
          - **Workflow Run Number**: ${{ github.run_number }}
          - **Workflow Run Attempt**: ${{ github.run_attempt }}
          - **Source Commit**: ${{ github.sha }}
          - **Purpose**: The APK is intended for testing.
          - **Disclaimer**: The APK is not a Play Store production release.
          - **Signature**: The APK is signed only with a temporary debug keystore.
          EOF
          )
          
          gh release create "$TAG_NAME" \
            "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always() && steps.prepare_asset.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            echo "========================================="
            echo "GitHub Release published successfully!"
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: $RELEASE_TITLE"
            echo "APK Asset Filename: $ASSET_NAME"
            RELEASE_URL=$(gh release view "$TAG_NAME" --json url -q .url 2>/dev/null || echo "")
            if [ -n "$RELEASE_URL" ]; then
              echo "Release Page URL: $RELEASE_URL"
            fi
            echo "========================================="

            {
              echo "## :white_check_mark: Debug APK Build & Release Summary"
              echo ""
              echo "- **Status**: Debug APK built and published successfully."
              if [ -n "$RELEASE_URL" ]; then
                echo "- **GitHub Release**: [$RELEASE_TITLE]($RELEASE_URL)"
              fi
              echo "- **Release Tag**: \`$TAG_NAME\`"
              echo "- **Release Asset**: \`$ASSET_NAME\`"
              echo ""
              echo "### Download Instructions"
              echo "1. The debug APK can be downloaded directly on your phone from the release **Assets** section above."
              echo "2. The normal GitHub Actions artifact (\`app-debug-apk\`) is also available as a backup under the workflow run summary."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed or encountered an error."
            echo "The APK build and artifact upload succeeded."
            echo "The Actions artifact named 'app-debug-apk' remains available for download."

            {
              echo "## :warning: Debug APK Build Succeeded (Release Publishing Notice)"
              echo ""
              echo "- **APK Build**: Succeeded."
              echo "- **Actions Artifact**: \`app-debug-apk\` was successfully uploaded and is available."
              echo "- **Release Publishing**: Release creation was skipped or failed. Your build artifact remains completely preserved."
              echo ""
              echo "You can download the APK from the **Artifacts** section at the bottom of this workflow run page."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
